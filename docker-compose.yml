services:
  problem-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    container_name: problem-tracker
    ports:
      - "8082:8082"

    volumes:
      - ./:/app:ro

    restart: unless-stopped

    mem_limit: 128m
    memswap_limit: 192m

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8082/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
